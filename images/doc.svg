<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Основной градиент круга -->
    <radialGradient id="docCircleGrad" cx="50%" cy="35%" r="70%" fx="50%" fy="30%">
      <stop offset="0%"   stop-color="#5fc4ee"/>
      <stop offset="35%"  stop-color="#1e8fd0"/>
      <stop offset="75%"  stop-color="#0b5394"/>
      <stop offset="100%" stop-color="#063a6b"/>
    </radialGradient>

    <!-- Верхний глянцевый блик -->
    <linearGradient id="docGlossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Тёмная нижняя полоса -->
    <linearGradient id="docBottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Градиент документа: белый с лёгким голубым оттенком -->
    <linearGradient id="docPageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#eaf4fb"/>
      <stop offset="100%" stop-color="#c8dced"/>
    </linearGradient>

    <!-- Градиент корешка книги -->
    <linearGradient id="docSpineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d6e8f5"/>
      <stop offset="100%" stop-color="#a8c6e0"/>
    </linearGradient>

    <!-- Градиент закладки (красная) -->
    <linearGradient id="docBookmarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>

    <!-- Тень под документом -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Внешняя тень круга -->
    <filter id="docOuterShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="docCircleClip">
      <circle cx="500" cy="500" r="440"/>
    </clipPath>
  </defs>

  <!-- Внешняя тень -->
  <circle cx="500" cy="500" r="440" fill="#0b3a63" opacity="0.4" filter="url(#docOuterShadow)"/>

  <!-- Основной круг -->
  <circle cx="500" cy="500" r="440" fill="url(#docCircleGrad)"/>

  <g clip-path="url(#docCircleClip)">
    <rect x="0" y="620" width="1000" height="380" fill="url(#docBottomShade)"/>
    <ellipse cx="500" cy="640" rx="440" ry="40" fill="#ffffff" opacity="0.06"/>
    <ellipse cx="500" cy="260" rx="420" ry="240" fill="url(#docGlossGrad)"/>
    <ellipse cx="380" cy="180" rx="200" ry="110" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="360" cy="160" rx="120" ry="60"  fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Окантовка -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="#062a4a" stroke-width="10"/>
  <circle cx="500" cy="500" r="435" fill="none" stroke="#1e6fb0" stroke-width="2" opacity="0.6"/>

  <!-- Документ (раскрытая книга) -->
  <g filter="url(#docShadow)">
    <!-- Левая страница -->
    <path d="
      M 290 300
      C 290 285, 300 275, 315 275
      L 490 275
      L 490 720
      L 315 720
      C 300 720, 290 710, 290 695
      Z"
      fill="url(#docPageGrad)"/>

    <!-- Правая страница -->
    <path d="
      M 510 275
      L 685 275
      C 700 275, 710 285, 710 300
      L 710 695
      C 710 710, 700 720, 685 720
      L 510 720
      Z"
      fill="url(#docPageGrad)"/>

    <!-- Корешок книги (полоса по центру) -->
    <rect x="490" y="275" width="20" height="445" fill="url(#docSpineGrad)"/>

    <!-- Тонкая тёмная линия корешка по центру -->
    <line x1="500" y1="275" x2="500" y2="720" stroke="#7a9ec0" stroke-width="1.5" opacity="0.6"/>

    <!-- Строчки текста на левой странице -->
    <g fill="#5b7c9a" opacity="0.75">
      <rect x="325" y="330" width="130" height="14" rx="3"/>
      <rect x="325" y="365" width="150" height="14" rx="3"/>
      <rect x="325" y="400" width="120" height="14" rx="3"/>
      <rect x="325" y="435" width="145" height="14" rx="3"/>
      <rect x="325" y="470" width="135" height="14" rx="3"/>
      <rect x="325" y="505" width="110" height="14" rx="3"/>
      <rect x="325" y="540" width="150" height="14" rx="3"/>
      <rect x="325" y="575" width="125" height="14" rx="3"/>
      <rect x="325" y="610" width="140" height="14" rx="3"/>
      <rect x="325" y="645" width="100" height="14" rx="3"/>
    </g>

    <!-- Строчки текста на правой странице -->
    <g fill="#5b7c9a" opacity="0.75">
      <rect x="525" y="330" width="140" height="14" rx="3"/>
      <rect x="525" y="365" width="160" height="14" rx="3"/>
      <rect x="525" y="400" width="130" height="14" rx="3"/>
      <rect x="525" y="435" width="150" height="14" rx="3"/>
      <rect x="525" y="470" width="120" height="14" rx="3"/>
      <rect x="525" y="505" width="145" height="14" rx="3"/>
      <rect x="525" y="540" width="110" height="14" rx="3"/>
      <rect x="525" y="575" width="155" height="14" rx="3"/>
      <rect x="525" y="610" width="135" height="14" rx="3"/>
      <rect x="525" y="645" width="115" height="14" rx="3"/>
    </g>
  </g>

  <!-- Красная закладка (поверх правой страницы, сверху) -->
  <g filter="url(#docShadow)">
    <path d="
      M 640 260
      L 690 260
      L 690 400
      L 665 370
      L 640 400
      Z"
      fill="url(#docBookmarkGrad)"/>
    <!-- Блик на закладке -->
    <path d="
      M 640 260
      L 690 260
      L 690 290
      L 640 290
      Z"
      fill="#ffffff" opacity="0.25"/>
  </g>

</svg>